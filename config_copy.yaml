# ─── 录音参数 ────────────────────────────
sample_rate: 16000          # 录音采样率（Hz）
channels: 1                 # 声道数
dtype: int16                # 采样位深
segment_seconds: 600        # 分片秒数。手机端写死与此对齐
# ─── 电脑端调度 ──────────────────────────
pc:
  data_dir: ~/.voice_diary   # 电脑端数据存储根目录
  hotspot_ssid_prefix: voice_diary  # 手机热点 SSID 前缀（WiFi 检测用）
  fetch_time_hour: 0         # 拉取小时
  fetch_time_minute: 5       # 拉取分钟
  retention_days: 7          # 保留天数
# ─── 邮件告警 ────────────────────────────
mail:
  enabled: false
  smtp_host: smtp.qq.com
  smtp_port: 587
  smtp_user: your@qq.com
  smtp_pass: your_token
  to: your@qq.com
# ─── 模型 ────────────────────────────────
model:
  dir:                      # 模型缓存目录（默认 ~/.cache/modelscope/hub）
  live: iic/speech_seaco_paraformer_large_asr_nat-zh-cn-16k-common-vocab8404-pytorch  # 实时转录用
  diary: iic/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-pytorch  # 日志转录用
  ncpu: 2                   # FunASR 线程数
# ─── 实时转录 ────────────────────────────
live:
  lock_file: /tmp/live_transcriber.lock
  result_file: /tmp/live_transcriber_result.json
  max_duration:  600          # 最长录音秒数
  idle_timeout_sec: 3600     # 空闲模型释放秒数（0=禁用）
  output_mode: window         # 输出方式: notification | cursor | window
  popup_copy_delay: 200       # 复制后停留毫秒，然后开始淡出
  popup_fade_ms: 300          # 淡出动画持续毫秒
