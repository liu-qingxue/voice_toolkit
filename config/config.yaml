# ─── 录音参数 ────────────────────────────
sample_rate: 16000          # 录音采样率(hz)
channels: 1                 # 声道数
dtype: int16                # 采样位深
segment_seconds: 600        # 分片秒数。
# --- 文件路径 ----------------------------
lock_file: /tmp/transcriber/live_transcriber.lock
result_file: /tmp/transcriber/live_transcriber_result.json
# ─── 模型 ────────────────────────────────
models:
  paraformer_v1: 
    dir: ~/.cache/modelscope/hub/models/iic/speech_seaco_paraformer_large_asr_nat-zh-cn-16k-common-vocab8404-pytorch/  # 推荐实时使用
    vad_path: ~/.cache/modelscope/hub/models/iic/speech_fsmn_vad_zh-cn-16k-common-pytorch/
    punc_path: ~/.cache/modelscope/hub/models/iic/punc_ct-transformer_zh-cn-common-vocab272727-pytorch/
    params: 
      ncpu: 2              # cpu线程
  paraformer_v2:
    dir: ~/.cache/modelscope/hub/models/iic/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-pytorch/
    vad_path: ~/.cache/modelscope/hub/models/iic/speech_fsmn_vad_zh-cn-16k-common-pytorch/
    punc_path: ~/.cache/modelscope/hub/models/iic/punc_ct-transformer_zh-cn-common-vocab272727-pytorch/
    params: 
      ncpu: 2
# ─── 工作模式设定与当前工作模式 ────────────────────────────
live:
  model: paraformer_v1
  max_duration: 6000          # 最长录音秒数
  idle_timeout_sec: 3600     # 空闲模型释放秒数(0=禁用）
  output_mode: window         # 输出方式: notification | cursor | window
  stream: false 
batch:
  model: paraformer_v2
  stream: false
# ─── 前端参数 ──────────────────────────────────────────
window:
  popup_copy_delay: 200       # 复制后停留毫秒，然后开始淡出
  popup_fade_ms: 300          # 淡出动画持续毫秒
